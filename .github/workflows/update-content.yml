name: Update content from source repos

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Specific repo to update (leave empty to update all)'
        required: false
  repository_dispatch:
    types: [new_release]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website repo
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: WCDAHT

      - name: Determine which repos to update
        id: repos
        env:
          MANUAL_REPO: ${{ github.event.inputs.repo }}
          DISPATCH_REPO: ${{ github.event.client_payload.repo }}
          REPOS_VAR: ${{ vars.REPOS_LIST }}
        run: |
          if [ -n "$DISPATCH_REPO" ]; then
            echo "repos=$DISPATCH_REPO" >> $GITHUB_OUTPUT
          elif [ -n "$MANUAL_REPO" ]; then
            echo "repos=$MANUAL_REPO" >> $GITHUB_OUTPUT
          elif [ -n "$REPOS_VAR" ]; then
            echo "repos=$REPOS_VAR" >> $GITHUB_OUTPUT
          else
            echo "repos=repo-one repo-two" >> $GITHUB_OUTPUT
          fi

      - name: Fetch releases and READMEs
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: WCDAHT
        run: |
          mkdir -p tmp_manifest

          for REPO in ${{ steps.repos.outputs.repos }}; do
            echo "------------------------------------------"
            echo "Processing $REPO..."

            # --- 1. Fetch latest release ---
            RELEASE=$(curl -s \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$ORG/$REPO/releases/latest")

            # Parse fields
            TAG=$(echo "$RELEASE" | jq -r '.tag_name')               # e.g. v.1.2.3
            VERSION=$(echo "$TAG" | sed 's/^v\.//')                   # strip leading "v." -> 1.2.3
            RELEASED_AT=$(echo "$RELEASE" | jq -r '.published_at' | cut -c1-10)  # YYYY-MM-DD
            ASSET_URL=$(echo "$RELEASE" | jq -r '.assets[0].url')
            ASSET_NAME=$(echo "$RELEASE" | jq -r '.assets[0].name')

            if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
              echo "No release found for $REPO, skipping."
              continue
            fi

            # --- Clear destination folder and recreate it ---
            echo "Clearing existing content in content/$REPO..."
            rm -rf "content/$REPO"
            mkdir -p "content/$REPO"

            # --- 2. Download release asset ---
            echo "Downloading release asset: $ASSET_NAME"
            curl -sL \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/octet-stream" \
              -o "content/$REPO/$ASSET_NAME" \
              "$ASSET_URL"

            # --- 3. Download README ---
            echo "Downloading README for $REPO"
            STATUS=$(curl -sL -w "%{http_code}" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github.raw+json" \
              "https://api.github.com/repos/$ORG/$REPO/contents/README.md" \
              -o "content/$REPO/README.md")

            if [ "$STATUS" -ne 200 ]; then
              rm -f "content/$REPO/README.md"
              echo "README.md not found (status $STATUS). Trying readme.md..."
              
              # Fallback to lowercase readme.md
              STATUS_LOWER=$(curl -sL -w "%{http_code}" \
                -H "Authorization: Bearer $TOKEN" \
                -H "Accept: application/vnd.github.raw+json" \
                "https://api.github.com/repos/$ORG/$REPO/contents/readme.md" \
                -o "content/$REPO/README.md")
                
              if [ "$STATUS_LOWER" -ne 200 ]; then
                rm -f "content/$REPO/README.md"
                echo "::warning::README not found for $REPO (status $STATUS_LOWER)."
              fi
            fi

            # --- 4. Download README_assets folder ---
            # Path in source: /docs/README_assets/
            # Path in dest: content/$REPO/README_assets/
            ASSET_DIR_SOURCE="docs/README_assets"
            ASSET_DIR_DEST="content/$REPO/docs/README_assets"
            
            echo "Checking for $ASSET_DIR_SOURCE..."
            
            # Request the contents of the directory via API
            DIR_RESPONSE=$(curl -s \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$ORG/$REPO/contents/$ASSET_DIR_SOURCE")

            # Check if the response is an array (indicating a directory)
            if echo "$DIR_RESPONSE" | jq -e 'type == "array"' > /dev/null; then
              echo "Found assets folder, downloading content..."
              mkdir -p "$ASSET_DIR_DEST"
              
              # Extract download_url and name for every file in that folder
              echo "$DIR_RESPONSE" | jq -c '.[] | select(.type == "file")' | while read -r item; do
                F_NAME=$(echo "$item" | jq -r '.name')
                F_URL=$(echo "$item" | jq -r '.download_url')
                
                curl -sL -H "Authorization: Bearer $TOKEN" -o "$ASSET_DIR_DEST/$F_NAME" "$F_URL"
                echo "  -> Downloaded $F_NAME"
              done
            else
              echo "::warning::Folder /$ASSET_DIR_SOURCE not found in $REPO. Images might be broken."
            fi

            # --- 5. Write per-repo manifest fragment ---
            if [ -f "content/$REPO/README.md" ]; then
              README_JSON_VAL="\"content/$REPO/README.md\""
            else
              README_JSON_VAL="null"
            fi

            cat > "tmp_manifest/$REPO.json" <<EOF
          {
            "version": "$VERSION",
            "released_at": "$RELEASED_AT",
            "original_filename": "$ASSET_NAME",
            "release_file": "content/$REPO/$ASSET_NAME",
            "readme_file": $README_JSON_VAL
          }
          EOF

            echo "Done: $REPO @ v$VERSION"
          done

      - name: Assemble manifest.json
        run: |
          # If this is a partial update (single repo), merge into existing manifest
          if [ -f manifest.json ]; then
            EXISTING=$(cat manifest.json)
          else
            EXISTING="{}"
          fi

          UPDATED="$EXISTING"
          for FRAGMENT in tmp_manifest/*.json; do
            REPO=$(basename "$FRAGMENT" .json)
            ENTRY=$(cat "$FRAGMENT")
            UPDATED=$(echo "$UPDATED" | jq --arg repo "$REPO" --argjson entry "$ENTRY" \
              '. + {($repo): $entry}')
          done

          echo "$UPDATED" | jq '.' > manifest.json
          echo "manifest.json updated."

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/ manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update content from source repos [skip ci]"
            git push
          else
            echo "No changes detected."
          fi